for (const [cat, items] of Object.entries(DATA)) {
  const h = document.createElement("h2"); h.textContent = cat;
  const ul = document.createElement("ul");
  items.forEach((r, i) => {
    const li = document.createElement("li");
    const code = `https://github.com/${USER}/${r.n}`;
    const url = r.p ? `https://${USER}.github.io/${r.n}/` : code;
    li.innerHTML = `<a href="${url}">${r.n}</a>${r.p ? `<a class="c" href="${code}">code</a>` : ""}<div class="d">${r.d}</div>`;
    if (i >= SHOWN) li.hidden = true;
    ul.append(li);
  });
  main.append(h, ul);
  if (items.length > SHOWN) {
    const b = document.createElement("button");
    b.textContent = `view ${items.length - SHOWN} more`;
    b.onclick = () => { ul.querySelectorAll("li[hidden]").forEach(li => li.hidden = false); b.remove(); };
    main.append(b);
  }
}
